name: Report an outdated or wrong limit
description: A size or weight limit in the dataset no longer matches the airline's own page.
title: "[Correction] "
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping keep this accurate. We check every report against the airline's own page before changing anything.
  - type: input
    id: airline
    attributes:
      label: Airline
      placeholder: e.g. Ryanair
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong
      description: Which value is out of date, and what the airline says now.
      placeholder: "Cabin bag is listed as 55 x 40 x 20 cm, the airline now says 55 x 40 x 23 cm."
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Link to the airline's page showing the current rule
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
    validations:
      required: false
